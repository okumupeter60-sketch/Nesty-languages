<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Nesty Languages</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
addEventListener("error", function (e) {
  var a = document.getElementById("app"); if (!a) return;
  var net = e.target && e.target.src;
  a.innerHTML = "<section style='text-align:center;padding:12vh 16px;font:18px system-ui,sans-serif'><img src='logo.svg' width='120' height='120' alt=''><h2>" + (net ? "No connection" : "Something went wrong") + "</h2><p style='color:#7a7260'>" + (net ? "Can not connect to Nesty Languages. Please check your internet connection and try again." : "Please try again. If it keeps happening, email isenyealvin@gmail.com.") + "</p><button onclick='location.reload()' style='background:#f2b705;border:0;border-radius:16px;padding:16px 28px;font:800 19px system-ui,sans-serif'>Try again</button></section>";
}, true);
</script>
</head>
<body>
<main id="app"><div class="splash"><img class="logo-anim" src="logo.svg" alt="Nesty Languages"><p>Loading…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
<script src="config.js"></script>
<script src="legal.js"></script>
<script src="app.js"></script>
</body>
</html>
